[project]
name = "cvdocs"
version = "0.1.0"
description = "Configurable block library and composer"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "typer[all]",
    "rich",
    "openai",
    "python-frontmatter",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff", "httpx"]

[project.scripts]
cvdocs = "cli:app"
cvdocs-web = "webapp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "cli",
    "config",
    "docs_api",
    "templates",
    "blocks",
    "naming",
    "constraints",
    "dissect",
    "generate",
    "mutate",
    "compose",
    "errors",
    "webapp",
    "block_fields",
    "progress",
    "retrieval",
    "text_input",
]
packages = ["parsing", "llm", "llm.providers", "auth", "storage"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
