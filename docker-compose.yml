services:
  app:
    build: .
    image: cvdocs:latest
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - output:/app/output
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-pull:
    image: cvdocs:latest
    entrypoint: [ "python", "-m", "deploy.pull_naming_model" ]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  output:
  ollama_data:
